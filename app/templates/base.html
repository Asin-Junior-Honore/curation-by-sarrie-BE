<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject or brand_name }}</title>
</head>
<body style="margin:0; padding:0; background-color:#FDF2F4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color:#2B1F24;">
  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color:#FDF2F4; padding: 32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" cellpadding="0" cellspacing="0" width="600" style="max-width:600px; background-color:#FFF9F5; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 24px rgba(107, 46, 68, 0.08);">

          <!-- Header -->
          <tr>
            <td style="background-color:#6B2E44; padding: 28px 40px; text-align: center;">
              <a href="{{ brand_url }}" style="text-decoration: none;">
                <span style="font-family: Georgia, 'Times New Roman', serif; font-size: 22px; color: #FFF9F5; letter-spacing: -0.5px;">
                  Curation <em style="color: #F8C8D1; font-style: italic;">by</em> Sarrie
                </span>
              </a>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding: 40px;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color: #FDF2F4; padding: 24px 40px; text-align: center; border-top: 1px solid rgba(248, 200, 209, 0.6);">
              <p style="font-size: 12px; color: #6B2E44; margin: 0 0 8px 0; letter-spacing: 1px; text-transform: uppercase;">
                Curation by Sarrie
              </p>
              <p style="font-size: 11px; color: rgba(43, 31, 36, 0.6); margin: 0;">
                Curating joy, since day one.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
